# Publishes the Focus frontend to GitHub Pages.
#
# Only the client is built and deployed. The Express server in server/ is not
# part of this artifact and is not running anywhere: Pages serves static files
# only, and Focus reads its data from localStorage, so the demo needs no API.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are allowed to finish so a live
# deployment is never cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the project is developed against. Vite 7
          # requires ^20.19.0 || >=22.12.0.
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check links
        working-directory: .
        run: node scripts/check-links.mjs

      - name: Build
        # vite.config.ts sets base to /focus/ for a production build.
        run: npm run build

      # Requires Pages to be switched on for the repository, with its source
      # set to GitHub Actions (Settings -> Pages -> Build and deployment).
      # `enablement: true` was tried here and the action still failed, so the
      # setting has to be made once by hand; it is not something this workflow
      # can do for itself with the default token.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
